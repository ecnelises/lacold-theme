name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag matches package version
        run: |
          package_version="$(ruby -Ilib -rlacold/version -e 'print Lacold::VERSION')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Verify and generate
        run: |
          bundle exec rake check
          bin/lacold build --output dist
          mkdir -p release

      - name: Package target archives
        run: |
          for directory in dist/*/; do
            target="${directory%/}"
            target="${target##*/}"
            tar -C dist -czf "release/lacold-${target}-${GITHUB_REF_NAME}.tar.gz" "$target"
          done
          tar -C dist -czf "release/lacold-all-${GITHUB_REF_NAME}.tar.gz" .
          cp dist/manifest.json release/manifest.json

      - name: Package VS Code extension
        working-directory: dist/vscode
        run: npx --yes @vscode/vsce@3.9.2 package --out "../../release/lacold-vscode-${GITHUB_REF_NAME}.vsix"

      - name: Write checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: |
          npx --yes @vscode/vsce@3.9.2 publish \
            --packagePath "release/lacold-vscode-${GITHUB_REF_NAME}.vsix"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          npx --yes ovsx@1.1.1 publish \
            "release/lacold-vscode-${GITHUB_REF_NAME}.vsix" \
            -p "$OVSX_PAT"
